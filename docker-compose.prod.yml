# Docker Compose Production Configuration for MyTelUV2
# Uses EXISTING Caddy on VPS for reverse proxy

services:
  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myteluv2-backend
    expose:
      - "5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - FACE_API_URL=http://face-recognition:5051
      - PYTHON_SERVICE_URL=http://face-recognition:5051
      - PLATE_API_URL=http://plate-recognition:5001
      - ANOMALY_SERVICE_URL=http://anomaly-detection:5003
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      face-recognition:
        condition: service_healthy
      plate-recognition:
        condition: service_healthy
      anomaly-detection:
        condition: service_healthy
    networks:
      - myteluv2-network
    restart: unless-stopped

  # Face Recognition Service (InsightFace)
  face-recognition:
    build:
      context: ./backend/python-service/face_recognition
      dockerfile: Dockerfile
    container_name: myteluv2-face-recognition
    expose:
      - "5051"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5051/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - FACE_API_KEY=${FACE_API_KEY}
    volumes:
      - insightface-models:/root/.insightface
    networks:
      - myteluv2-network
    restart: unless-stopped

  # Plate Recognition Service (YOLOv8)
  plate-recognition:
    build:
      context: ./backend/python-service/plate_recognition
      dockerfile: Dockerfile
    container_name: myteluv2-plate-recognition
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - NODEJS_BACKEND_URL=http://backend:5050
    env_file:
      - .env
    volumes:
      - ./backend/python-service/plate_recognition/models:/app/models
    networks:
      - myteluv2-network
    restart: unless-stopped

  # Anomaly Detection Service (Isolation Forest)
  anomaly-detection:
    build:
      context: ./backend/python-service/anomaly_detection
      dockerfile: Dockerfile
    container_name: myteluv2-anomaly-detection
    expose:
      - "5003"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - myteluv2-network
    restart: unless-stopped

  # Docker Caddy Router
  caddy:
    image: caddy:2-alpine
    container_name: myteluv2-caddy
    ports:
      - "8880:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      backend:
        condition: service_started
      face-recognition:
        condition: service_healthy
      plate-recognition:
        condition: service_healthy
      anomaly-detection:
        condition: service_healthy
    networks:
      - myteluv2-network
    restart: unless-stopped

networks:
  myteluv2-network:
    driver: bridge

volumes:
  insightface-models:
    name: myteluv2-insightface-models
