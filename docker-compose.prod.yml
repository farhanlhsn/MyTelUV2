# Docker Compose Production Configuration for MyTelUV2
# Uses EXISTING Caddy on VPS for reverse proxy

# Rotate container logs so they cannot fill the disk (json-file keeps unbounded logs by default)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myteluv2-backend
    expose:
      - "5050"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - PORT=5050
      - FACE_API_URL=http://face-recognition:5051
      - PYTHON_SERVICE_URL=http://face-recognition:5051
      - PLATE_API_URL=http://plate-recognition:5001
      - ANOMALY_SERVICE_URL=http://anomaly-detection:5003
      # API keys the backend sends (X-API-Key) to the AI services; each service needs the same value
      - FACE_API_KEY=${FACE_API_KEY}
      - PLATE_API_KEY=${PLATE_API_KEY}
      - ANOMALY_API_KEY=${ANOMALY_API_KEY}
      # Audit log directory (the backend-logs volume is mounted here)
      - AUDIT_LOG_DIR=/app/logs
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      face-recognition:
        condition: service_healthy
      plate-recognition:
        condition: service_healthy
      anomaly-detection:
        condition: service_healthy
    networks:
      - myteluv2-network
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  # Face Recognition Service (InsightFace)
  face-recognition:
    build:
      context: ./backend/python-service/face_recognition
      dockerfile: Dockerfile
    container_name: myteluv2-face-recognition
    expose:
      - "5051"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5051/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - TZ=Asia/Jakarta
      - FACE_API_KEY=${FACE_API_KEY}
    volumes:
      # The service runs as appuser, whose HOME is /home/appuser
      - insightface-models:/home/appuser/.insightface
    networks:
      - myteluv2-network
    mem_limit: 2g
    logging: *default-logging
    restart: unless-stopped

  # Plate Recognition Service (YOLOv8)
  plate-recognition:
    build:
      context: ./backend/python-service/plate_recognition
      dockerfile: Dockerfile
    container_name: myteluv2-plate-recognition
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - TZ=Asia/Jakarta
      - NODEJS_BACKEND_URL=http://backend:5050
      - PLATE_API_KEY=${PLATE_API_KEY}
    env_file:
      - .env
    volumes:
      - ./backend/python-service/plate_recognition/models:/app/models
    networks:
      - myteluv2-network
    mem_limit: 1g
    logging: *default-logging
    restart: unless-stopped

  # Anomaly Detection Service (Isolation Forest)
  anomaly-detection:
    build:
      context: ./backend/python-service/anomaly_detection
      dockerfile: Dockerfile
    container_name: myteluv2-anomaly-detection
    expose:
      - "5003"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      - TZ=Asia/Jakarta
      - ANOMALY_API_KEY=${ANOMALY_API_KEY}
    networks:
      - myteluv2-network
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  # Docker Caddy Router
  caddy:
    image: caddy:2-alpine
    container_name: myteluv2-caddy
    ports:
      - "127.0.0.1:8880:80"
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      backend:
        condition: service_started
      face-recognition:
        condition: service_healthy
      plate-recognition:
        condition: service_healthy
      anomaly-detection:
        condition: service_healthy
    networks:
      - myteluv2-network
    mem_limit: 128m
    logging: *default-logging
    restart: unless-stopped

networks:
  myteluv2-network:
    driver: bridge

volumes:
  insightface-models:
    name: myteluv2-insightface-models
  backend-logs:
    name: myteluv2-backend-logs
